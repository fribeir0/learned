<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Network Scanner</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="light-theme">
    <div class="container">
        <header>
            <h1><i class="fas fa-network-wired"></i> Advanced Network Scanner</h1>
            <div class="header-controls">
                <div class="theme-switch-wrapper">
                    <label class="theme-switch" for="theme-checkbox">
                        <input type="checkbox" id="theme-checkbox">
                        <div class="slider round"></div>
                    </label>
                    <span id="theme-label">Dark Mode</span>
                </div>
            </div>
        </header>

        <div class="controls">
            <div class="control-group">
                <div class="network-input">
                    <label for="network-range"><i class="fas fa-project-diagram"></i> Network Range:</label>
                    <input type="text" id="network-range" value="192.168.0" placeholder="e.g. 192.168.1">
                </div>
                
                <div class="scan-type">
                    <label for="scan-type"><i class="fas fa-bullseye"></i> Scan Type:</label>
                    <select id="scan-type">
                        <option value="common">Common Ports</option>
                        <option value="all">All Ports</option>
                        <option value="custom">Custom Ports</option>
                    </select>
                </div>
            </div>
            
            <div class="button-group">
                <button id="scanButton" class="btn primary">
                    <i class="fas fa-search"></i> Start Scan
                </button>
                <button id="stopButton" class="btn danger" disabled>
                    <i class="fas fa-stop"></i> Stop
                </button>
                <button id="export-btn" class="btn secondary">
                    <i class="fas fa-file-export"></i> Export CSV
                </button>
            </div>
        </div>

        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <span id="status-message">Scanning network...</span>
        </div>

        <div class="stats">
            <div class="stat-card total">
                <h3><i class="fas fa-server"></i> Total Devices</h3>
                <span id="total-devices">0</span>
            </div>
            <div class="stat-card linux">
                <h3><i class="fab fa-linux"></i> Linux</h3>
                <span id="linux-count">0</span>
            </div>
            <div class="stat-card windows">
                <h3><i class="fab fa-windows"></i> Windows</h3>
                <span id="windows-count">0</span>
            </div>
            <div class="stat-card router">
                <h3><i class="fas fa-router"></i> Routers</h3>
                <span id="router-count">0</span>
            </div>
            <div class="stat-card iot">
                <h3><i class="fas fa-microchip"></i> IoT</h3>
                <span id="iot-count">0</span>
            </div>
            <div class="stat-card unknown">
                <h3><i class="fas fa-question"></i> Unknown</h3>
                <span id="unknown-count">0</span>
            </div>
        </div>

        <div class="search-container">
            <i class="fas fa-search search-icon"></i>
            <input type="text" id="search" placeholder="Search devices by IP, MAC, OS, vendor...">
        </div>

        <div class="table-container">
            <table id="devicesTable">
                <thead>
                    <tr>
                        <th>IP Address</th>
                        <th>MAC Address</th>
                        <th>OS Type</th>
                        <th>Vendor</th>
                        <th>Open Ports</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
